
#最小连接数
spring.mongodb.pool.min-size=0

#最大连接数
spring.mongodb.pool.max-size=2500

#最大等待时间 1000 * 60 * 2
spring.mongodb.pool.max-wait-time=120000

#连接池连接的最大存活时间 0表示没有限制
spring.mongodb.pool.max-connection-life-time=0

#连接池连接最大空闲时间 0表示没有限制
spring.mongodb.pool.max-connection-idle-time=0


spring.mongodb.pool.maintenance-initial-delay=0

# 1000 * 60
spring.mongodb.pool.maintenance-frequency=60000

