    enabled: true
    admin-user:
      id: demo
      password: demo
      first-name: 超级管理员
      last-name: 超级管理员
    database:
      schema-update: true
      type: mysql
    job-execution:
      enabled: false
    #关闭自动部署
    auto-deployment-enabled: false
